name: CI

on: [push, pull_request]

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7 # https://github.com/actions/checkout
      - name: Setup Java
        uses: actions/setup-java@v6 # https://github.com/actions/setup-java
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6 # https://github.com/gradle/actions

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7 # https://github.com/actions/checkout
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6 # https://github.com/gradle/actions
      - name: Set up JDK 17
        uses: actions/setup-java@v6 # https://github.com/actions/setup-java
        with:
          distribution: temurin
          java-version: 17
      - name: Set encoding and print version information
        run: |
          export LANG=C.UTF-8
          locale
          ./gradlew --version
      - name: Setup Gradle (this action caches various parts as well)
        uses: gradle/actions/setup-gradle@v6 # https://github.com/gradle/actions
      - name: Build with Gradle
        run: ./gradlew check
